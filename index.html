<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Flappy Bird — Modern</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app" id="app">
      <div class="game" id="gameRoot">
        <canvas class="game__canvas" id="gameCanvas" aria-label="Flappy Bird" role="img"></canvas>

        <div class="hud" id="hud" aria-live="polite">
          <div class="pill">
            <span class="pill__label">Điểm</span>
            <span class="pill__value" id="scoreText">0</span>
          </div>
          <div class="pill">
            <span class="pill__label">Cao nhất</span>
            <span class="pill__value" id="bestText">0</span>
          </div>
        </div>

        <div class="topbar">
          <button class="icon" id="soundBtn" type="button" aria-label="Bật/tắt âm thanh" aria-pressed="true">
            <span class="icon__glyph" aria-hidden="true">🔊</span>
          </button>
          <button class="icon" id="dayNightBtn" type="button" aria-label="Đổi ngày/đêm" aria-pressed="false">
            <span class="icon__glyph" aria-hidden="true">🌙</span>
          </button>
          <button class="icon" id="skinBtn" type="button" aria-label="Đổi skin chim">
            <span class="icon__glyph" aria-hidden="true">🐤</span>
          </button>
        </div>

        <section class="overlay overlay--menu is-visible" id="menuOverlay" aria-label="Menu bắt đầu">
          <div class="panel">
            <div class="brand">
              <div class="brand__badge" aria-hidden="true">FB</div>
              <div>
                <div class="brand__title">Flappy Bird</div>
                <div class="brand__sub">SPACE / Click / Chạm để bay</div>
              </div>
            </div>

            <div class="stats">
              <div class="stat">
                <div class="stat__label">Điểm cao nhất</div>
                <div class="stat__value" id="bestTextMenu">0</div>
              </div>
              <div class="stat">
                <div class="stat__label">Chế độ</div>
                <div class="stat__value" id="modeText">Ngày</div>
              </div>
              <div class="stat">
                <div class="stat__label">Skin</div>
                <div class="stat__value" id="skinText">Neon</div>
              </div>
            </div>

            <div class="actions">
              <button class="btn btn--primary" id="startBtn" type="button">Bắt đầu</button>
              <button class="btn" id="howBtn" type="button">Hướng dẫn</button>
            </div>

            <div class="how is-hidden" id="howBox" role="region" aria-label="Hướng dẫn chơi">
              <div class="how__row">
                <span class="tag">Bay</span>
                <span>SPACE hoặc Click/Chạm</span>
              </div>
              <div class="how__row">
                <span class="tag">Đổi skin</span>
                <span>Nút 🐤</span>
              </div>
              <div class="how__row">
                <span class="tag">Ngày/Đêm</span>
                <span>Nút 🌙</span>
              </div>
            </div>
          </div>
        </section>

        <section class="overlay overlay--gameover" id="gameOverOverlay" aria-label="Game Over" aria-hidden="true">
          <div class="panel panel--tight">
            <div class="over">
              <div class="over__title">Game Over</div>
              <div class="over__sub">Bạn đã va chạm!</div>
            </div>
            <div class="stats stats--two">
              <div class="stat">
                <div class="stat__label">Điểm</div>
                <div class="stat__value" id="scoreTextOver">0</div>
              </div>
              <div class="stat">
                <div class="stat__label">Cao nhất</div>
                <div class="stat__value" id="bestTextOver">0</div>
              </div>
            </div>
            <div class="actions">
              <button class="btn btn--primary" id="restartBtn" type="button">Restart</button>
              <button class="btn" id="menuBtn" type="button">Menu</button>
            </div>
          </div>
        </section>

        <div class="hint" id="tapHint" aria-hidden="true">Chạm / Click / SPACE để bay</div>
      </div>
    </main>

    <script src="./script.js" defer></script>
  </body>
</html>
